version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/examples/python"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/examples/typescript"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "cargo"
    directory: "/examples/rust"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

# Once you've promoted one example into src/ and removed the others (see
# TEMPLATE_SETUP.md), update the `directory` for your chosen ecosystem to
# "/src" and delete the entries for the ecosystems you removed.
