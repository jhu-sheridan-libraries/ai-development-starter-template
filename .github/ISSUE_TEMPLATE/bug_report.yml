name: Bug report
description: Report something that isn't working as expected.
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, language/runtime version, relevant dependency versions.
    validations:
      required: false

  - type: checkboxes
    id: sensitive-data-check
    attributes:
      label: Confirmation
      options:
        - label: I have not included any real credentials, secrets, or PII/PHI in this report.
          required: true
