name: CI

# Path-filtered per-language jobs: each job only runs when files under its
# example/src path change. Once you've promoted one example into src/ and
# removed the others (see TEMPLATE_SETUP.md), delete the jobs for the
# languages you removed and update the surviving job's `paths` filter to
# also cover src/.
#
# Actions are pinned to a commit SHA (not just a tag) per this
# organization's convention (see gh-workflows'
# .github/workflow-templates/kiro-bootstrap.yml). Permissions are
# least-privilege: read-only, since this workflow only builds and tests.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (examples/python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: examples/python
        run: pip install -e ".[dev]"

      - name: Lint
        working-directory: examples/python
        run: ruff check .

      - name: Test
        working-directory: examples/python
        run: pytest

  typescript:
    name: TypeScript (examples/typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: examples/typescript
        run: npm ci

      - name: Lint
        working-directory: examples/typescript
        run: npm run lint

      - name: Type check
        working-directory: examples/typescript
        run: npm run typecheck

      - name: Test
        working-directory: examples/typescript
        run: npm test

  rust:
    name: Rust (examples/rust)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@11df97af8e8102fd60b60a77dfbf58d40cd843b8 # v1.10.1
        with:
          components: clippy, rustfmt

      - name: Format check
        working-directory: examples/rust
        run: cargo fmt --check

      - name: Lint
        working-directory: examples/rust
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: examples/rust
        run: cargo test

  actionlint:
    name: Lint workflow files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run actionlint
        uses: reviewdog/action-actionlint@a8ac3eea598697a830f7d8e701fc9fcbfde88974 # v1.80.0
